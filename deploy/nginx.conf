# Nginx конфигурация для Minimall
# Положить в: /etc/nginx/sites-available/minimall
# Затем: ln -s /etc/nginx/sites-available/minimall /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name mini-mall.uz www.mini-mall.uz;

    # Редирект HTTP -> HTTPS (раскомментировать после получения SSL)
    # return 301 https://$host$request_uri;

    root /var/www/minimall/dist;
    index index.html;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/xml
        application/json
        image/svg+xml;

    # Кэш статических файлов (1 год)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback — все маршруты -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Безопасность
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

